schema_version: 1

context:
  name: fluprodia
  version: '4.3'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/fluprodia-${{ version }}.tar.gz
  sha256: 4fe8382239789b1e08ad7e5ead52bd9cccb15a935217117388073a044d007f6b

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.2,<4
    - pip
  run:
    - python >=${{ python_min }}
    - coolprop >=6.4
    - numpy >=1.13.3
    - pint
    - python-build >=1.5.0
tests:
  - python:
      imports:
        - fluprodia
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Create beautiful fluid property diagrams using CoolProp
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/fwitte/fluprodia

extra:
  recipe-maintainers:
    - jan-janssen
